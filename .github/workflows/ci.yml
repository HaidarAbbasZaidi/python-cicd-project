name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH connection
        run: |
          echo "Testing EC2 SSH port..."
          timeout 10 bash -c "</dev/tcp/${{ secrets.EC2_HOST }}/22" && echo "SSH port 22 is OPEN" || echo "SSH port 22 is NOT reachable"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/python-cicd-project
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt
            pkill -f "python app.py" || true
            nohup python app.py > nohup.out 2>&1 &